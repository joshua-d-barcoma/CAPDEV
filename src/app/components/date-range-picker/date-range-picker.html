<div class="drp-wrapper">
  <button
    type="button"
    class="drp-trigger"
    [class.open]="isOpen"
    [attr.aria-expanded]="isOpen"
    aria-haspopup="dialog"
    (click)="toggle()"
  >
    <svg class="drp-icon-cal" viewBox="0 0 16 16" fill="none" aria-hidden="true">
      <rect x="1" y="2" width="14" height="13" rx="2" stroke="currentColor" stroke-width="1.4" />
      <path d="M1 6h14" stroke="currentColor" stroke-width="1.4" />
      <path d="M5 1v2M11 1v2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
    </svg>
    <span>{{ startDate ? displayLabel : label }}</span>
    <svg class="drp-icon-chevron" [class.rotated]="isOpen" viewBox="0 0 10 6" fill="none" aria-hidden="true">
      <path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </button>

  @if (isOpen) {
    <div class="drp-panel" role="dialog" [attr.aria-label]="label">
      <div class="drp-layout">
        <div class="drp-presets">
          @for (preset of presets; track preset.key) {
            <button
              type="button"
              class="drp-preset-btn"
              [class.active]="selectedPreset === preset.key"
              (click)="selectPreset(preset.key)"
            >
              {{ preset.label }}
            </button>
          }

          <div class="drp-actions">
            <button
              type="button"
              class="drp-action-confirm"
              [disabled]="!draftStart"
              (click)="confirm()"
            >
              Confirm
            </button>
            <button type="button" class="drp-action-reset" (click)="reset()">
              Reset
            </button>
          </div>
        </div>

        <div class="drp-calendar">
          <div class="drp-cal-header">
            <span class="drp-month-label">{{ monthLabel }}</span>
            <div class="drp-nav">
              <button
                type="button"
                class="drp-nav-btn"
                aria-label="Previous month"
                (click)="previousMonth()"
              >
                <svg viewBox="0 0 6 10" fill="none" aria-hidden="true">
                  <path d="M5 1L1 5l4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </button>
              <button
                type="button"
                class="drp-nav-btn"
                aria-label="Next month"
                (click)="nextMonth()"
              >
                <svg viewBox="0 0 6 10" fill="none" aria-hidden="true">
                  <path d="M1 1l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </button>
            </div>
          </div>

          <div class="drp-grid drp-weekdays" aria-hidden="true">
            @for (weekday of weekdays; track weekday) {
              <span class="drp-weekday">{{ weekday }}</span>
            }
          </div>

          <div class="drp-grid drp-days">
            @for (day of calendarDays; track day.date.getTime()) {
              <button
                type="button"
                class="drp-day"
                [class.other-month]="!day.currentMonth"
                [class.today]="day.today"
                [class.start]="day.start"
                [class.end]="day.end"
                [class.in-range]="day.inRange"
                [attr.aria-pressed]="day.start || day.end"
                [attr.aria-label]="day.date.toLocaleDateString('en-US', {
                  month: 'long',
                  day: 'numeric',
                  year: 'numeric'
                })"
                (mouseenter)="previewDay(day.date)"
                (click)="selectDay(day.date)"
              >
                <span class="drp-day-inner">{{ day.date.getDate() }}</span>
              </button>
            }
          </div>
        </div>
      </div>
    </div>
  }
</div>
